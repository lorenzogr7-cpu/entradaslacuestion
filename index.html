<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LA CUESTIÓN · Poesía y Banderas</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #008080;
            font-family: 'Tiny5', 'Courier New', monospace;
            min-height: 100vh;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-app {
            width: 100%;
            height: 100vh;
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            box-shadow: 2px 2px 0px #00000066;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Tiny5', monospace;
            flex-shrink: 0;
        }

        .window-content {
            padding: 16px;
            border: 1px solid #808080;
            margin: 2px;
            background: #c0c0c0;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Contenedor de banderas ficticias */
        .flags-title {
            font-family: 'Tiny5', monospace;
            font-size: 1.2rem;
            text-align: center;
            background: #000080;
            color: white;
            display: inline-block;
            padding: 6px 16px;
            margin: 0 auto 20px auto;
            letter-spacing: 2px;
        }
        .flags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 10px 0 20px;
            padding: 16px;
            background: #a0a0a0;
            border: 1px solid #808080;
        }
        .fake-flag {
            width: 110px;
            height: 80px;
            background: #fff;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.7rem;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            padding: 6px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .fake-flag:active {
            transform: scale(0.96);
        }
        .flag1 { background: linear-gradient(135deg, #ff4d4d 50%, #ffcc00 50%); }
        .flag2 { background: repeating-linear-gradient(90deg, #00aaff, #00aaff 20px, #ffffff 20px, #ffffff 40px); }
        .flag3 { background: radial-gradient(circle at 30% 40%, #ff66cc, #9933ff); }
        .flag4 { background: repeating-linear-gradient(45deg, #33cc33, #33cc33 15px, #ff9933 15px, #ff9933 30px); }
        .flag5 { background: linear-gradient(0deg, #ff6600, #ffffff, #009933); }
        .flag-text {
            background: #fffbe6;
            color: #000;
            border: 3px solid #1f1a10;
            font-size: 0.6rem;
            line-height: 1.3;
            text-transform: uppercase;
            padding: 8px 4px;
        }
        .flag-text span {
            display: block;
        }

        /* Terminal para el poema */
        .terminal-win {
            font-family: 'Tiny5', monospace;
            padding: 24px 20px;
            height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #808080;
            font-size: 1.1rem;
            line-height: 1.6;
            background: #000000;
            color: #00ff00;
            transition: background 0.2s;
        }
        .poem-line {
            margin: 12px 0;
            border-left: 3px solid #0f0;
            padding-left: 16px;
        }

        .win-button {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 12px 20px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: 0.03s linear;
            color: #000;
        }
        .win-button:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            transform: translate(1px, 1px);
        }

        .modal-win {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.1s;
            z-index: 2000;
        }
        .modal-win.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-dialog {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            font-family: 'Tiny5', monospace;
        }
        .modal-dialog h3 {
            background: #000080;
            color: white;
            padding: 6px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-dialog p {
            background: #e0e0e0;
            padding: 12px;
            margin: 8px 0;
            word-break: break-word;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 6px 14px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
        }
        footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 20px;
            color: #000;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 560px) {
            .fake-flag { width: 80px; height: 60px; font-size: 0.55rem; }
            .terminal-win { font-size: 0.85rem; height: 65vh; }
            .flags-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="win-app">
    <!-- Pantalla 1: solo banderas ficticias -->
    <div id="splashScreen" class="window">
        <div class="title-bar"><span>Galería de Banderas</span><span>⤡</span></div>
        <div class="window-content">
            <div style="text-align:center;">
                <div class="flags-title">✦ elegí tu bandera ✦</div>
            </div>
            <div class="flags-row">
                <div class="fake-flag flag1" data-flag="1"></div>
                <div class="fake-flag flag2" data-flag="2"></div>
                <div class="fake-flag flag3" data-flag="3"></div>
                <div class="fake-flag flag4" data-flag="4"></div>
                <div class="fake-flag flag5" data-flag="5"></div>
                <div class="fake-flag flag-text" data-flag="poesia">
                    <span>AQUI SE</span>
                    <span>ESTÁ</span>
                    <span>LEYENDO</span>
                    <span>POESÍA</span>
                </div>
            </div>
            <footer>Windows 1.0 – Tiny5 edition</footer>
        </div>
    </div>

    <!-- Pantalla 2: carga con el poema escribiéndose letra por letra -->
    <div id="loadingScreen" class="window hidden">
        <div class="title-bar"><span>Poema en carga</span><span>⎕</span></div>
        <div class="window-content" style="padding: 6px;">
            <div id="poemTerminal" class="terminal-win"></div>
        </div>
    </div>

    <!-- Pantalla 3: menú principal -->
    <div id="mainMenu" class="window hidden">
        <div class="title-bar"><span>LA CUESTIÓN - Menú</span><span>⎕</span></div>
        <div class="window-content">
            <div style="text-align:center; margin-bottom:20px;">
                <div style="background:#000080; color:white; padding:10px; font-size:1.3rem; letter-spacing:2px;">LA CUESTIÓN</div>
            </div>
            <div style="display:flex; flex-direction:column; gap:20px; max-width:300px; margin:0 auto; width:100%;">
                <button id="btnUbicacion" class="win-button">📍 UBICACIÓN</button>
                <button id="btnEntradas" class="win-button">🎟️ ENTRADAS</button>
                <button id="btnPista" class="win-button">🔍 PISTA</button>
            </div>
            <footer style="margin-top:32px;">Latinoamérica unida por la poesía</footer>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modalWin" class="modal-win">
    <div class="modal-dialog">
        <h3 id="modalTitle">---</h3>
        <p id="modalMessage"></p>
        <div id="modalExtra" class="modal-buttons"></div>
        <div class="modal-buttons">
            <button id="closeModalBtn" class="modal-btn">Cerrar</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- ELEMENTOS DOM -----
        const splashDiv = document.getElementById('splashScreen');
        const loadingDiv = document.getElementById('loadingScreen');
        const mainMenuDiv = document.getElementById('mainMenu');
        const poemTerminal = document.getElementById('poemTerminal');
        const modal = document.getElementById('modalWin');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalExtra = document.getElementById('modalExtra');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        // ----- POEMA COMPLETO (respetando la "k" y saltos de línea) -----
        const poemLines = [
            "y al final,",
            "un poco más tarde ke ahora,",
            "cuando estés volviendo a tu casa,",
            "mirarte y decir:",
            "hoy fue para mi.",
            "hoy, a este mundo,",
            "le robé una noche"
        ];
        
        // ----- FUNCIONES MODAL -----
        function closeModal() {
            modal.classList.remove('active');
            modalExtra.innerHTML = '';
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
        
        // ----- EFECTO MÁQUINA DE ESCRIBIR (letra por letra) -----
        let typingInterval = null;
        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let currentLineElement = null;
        
        function startPoemTyping(callback) {
            poemTerminal.innerHTML = '';
            currentLineIndex = 0;
            currentCharIndex = 0;
            
            function typeNextChar() {
                if (currentLineIndex >= poemLines.length) {
                    // Terminó el poema
                    if (typingInterval) clearInterval(typingInterval);
                    if (callback) callback();
                    return;
                }
                
                const line = poemLines[currentLineIndex];
                if (currentCharIndex === 0) {
                    // Crear nuevo párrafo para esta línea
                    currentLineElement = document.createElement('p');
                    currentLineElement.className = 'poem-line';
                    currentLineElement.textContent = '';
                    poemTerminal.appendChild(currentLineElement);
                    poemTerminal.scrollTop = poemTerminal.scrollHeight;
                }
                
                if (currentCharIndex < line.length) {
                    // Agregar un caracter (puede ser letra o espacio)
                    currentLineElement.textContent += line[currentCharIndex];
                    currentCharIndex++;
                    poemTerminal.scrollTop = poemTerminal.scrollHeight;
                } else {
                    // Pasar a la siguiente línea
                    currentLineIndex++;
                    currentCharIndex = 0;
                    currentLineElement = null;
                    // Pequeña pausa entre líneas (no afecta al intervalo, solo espera)
                }
            }
            
            typingInterval = setInterval(typeNextChar, 70); // velocidad agradable
        }
        
        function stopTyping() {
            if (typingInterval) {
                clearInterval(typingInterval);
                typingInterval = null;
            }
        }
        
        // ----- CARGA: mostrar terminal con el poema y luego pasar al menú -----
        let loadingActive = false;
        function startLoading() {
            if (loadingActive) return;
            loadingActive = true;
            
            splashDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            mainMenuDiv.classList.add('hidden');
            poemTerminal.innerHTML = '';
            
            // Iniciar el efecto máquina de escribir
            startPoemTyping(() => {
                // Cuando termina el poema, esperar un poco y pasar al menú
                setTimeout(() => {
                    finishLoading();
                }, 1200);
            });
        }
        
        function finishLoading() {
            stopTyping();
            loadingDiv.classList.add('hidden');
            mainMenuDiv.classList.remove('hidden');
            poemTerminal.innerHTML = '';
            loadingActive = false;
        }
        
        // ----- AL HACER CLIC EN CUALQUIER BANDERA FICTICIA, ARRANCA LA CARGA -----
        const flagsElements = document.querySelectorAll('.fake-flag');
        flagsElements.forEach(flag => {
            flag.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!splashDiv.classList.contains('hidden')) {
                    startLoading();
                }
            });
        });
        
        // ----- BOTONES DEL MENÚ -----
        document.getElementById('btnUbicacion').addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/?api=1&query=Centro+de+Poesía+Buenos+Aires', '_blank');
        });
        
        // ENTRADAS: deep link para abrir la app de Mercado Pago directamente
        document.getElementById('btnEntradas').addEventListener('click', (e) => {
            e.preventDefault();
            const alias = "ellorenzopa.banda";
            const monto = "4000";
            modalTitle.innerText = "Entradas - $4000";
            modalMessage.innerText = `Alias: ${alias}\nMonto: ARS ${monto}\n\nElegí una opción:`;
            modalExtra.innerHTML = '';
            
            const btnOpenMP = document.createElement('button');
            btnOpenMP.innerText = "Abrir Mercado Pago (App)";
            btnOpenMP.classList.add('modal-btn');
            btnOpenMP.addEventListener('click', () => {
                // Deep link para abrir la app directamente (Android/iOS)
                const deepLink = "mercadopago://";
                const webFallback = "https://www.mercadopago.com.ar/transferencias";
                // Intentamos abrir el deep link con un iframe
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = deepLink;
                document.body.appendChild(iframe);
                // Si después de 800ms no se abrió, redirigimos a la web
                const timeout = setTimeout(() => {
                    window.location.href = webFallback;
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 800);
                window.addEventListener('blur', () => {
                    clearTimeout(timeout);
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, { once: true });
                setTimeout(() => {
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 1000);
                closeModal();
            });
            
            const btnCopy = document.createElement('button');
            btnCopy.innerText = "Copiar Alias";
            btnCopy.classList.add('modal-btn');
            btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(alias).then(() => {
                    showToast("Alias copiado: " + alias);
                }).catch(() => {
                    alert("Copiá manual: " + alias);
                });
            });
            
            modalExtra.appendChild(btnOpenMP);
            modalExtra.appendChild(btnCopy);
            modal.classList.add('active');
        });
        
        document.getElementById('btnPista').addEventListener('click', () => {
            modalTitle.innerText = "Pista Oculta";
            modalMessage.innerText = '"seremos el centro del temblor"';
            modalExtra.innerHTML = '';
            const okBtn = document.createElement('button');
            okBtn.innerText = "Entendido";
            okBtn.classList.add('modal-btn');
            okBtn.addEventListener('click', closeModal);
            modalExtra.appendChild(okBtn);
            modal.classList.add('active');
        });
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '40px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#ffffcc';
            toast.style.color = '#000';
            toast.style.padding = '8px 16px';
            toast.style.fontFamily = 'Tiny5, monospace';
            toast.style.border = '2px solid #000';
            toast.style.zIndex = '10000';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    })();
</script>
</body>
</html>
