<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LA CUESTIÓN · Banderas y Poesía Sinfónica</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #008080;
            font-family: 'Tiny5', 'Courier New', monospace;
            min-height: 100vh;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-app {
            width: 100%;
            height: 100vh;
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            box-shadow: 2px 2px 0px #00000066;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Tiny5', monospace;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .window-content {
            padding: 16px;
            border: 1px solid #808080;
            margin: 2px;
            background: #c0c0c0;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: background 0.2s;
        }

        .flags-title {
            font-family: 'Tiny5', monospace;
            font-size: 1.2rem;
            text-align: center;
            background: #000080;
            color: white;
            display: inline-block;
            padding: 6px 16px;
            margin: 0 auto 20px auto;
            letter-spacing: 2px;
        }

        .flags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 10px 0 20px;
            padding: 16px;
            background: #a0a0a0;
            border: 1px solid #808080;
        }

        .fake-flag {
            width: 110px;
            height: 80px;
            background: #fff;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.7rem;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            padding: 6px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .fake-flag:active { transform: scale(0.96); }

        .flag1 { background: linear-gradient(135deg, #ff4d4d 50%, #ffcc00 50%); }
        .flag2 { background: repeating-linear-gradient(90deg, #00aaff, #00aaff 20px, #ffffff 20px, #ffffff 40px); }
        .flag3 { background: radial-gradient(circle at 30% 40%, #ff66cc, #9933ff); }
        .flag4 { background: repeating-linear-gradient(45deg, #33cc33, #33cc33 15px, #ff9933 15px, #ff9933 30px); }
        .flag5 { background: linear-gradient(0deg, #ff6600, #ffffff, #009933); }
        .flag-text {
            background: #fffbe6;
            color: #000;
            border: 3px solid #1f1a10;
            font-size: 0.6rem;
            line-height: 1.3;
            text-transform: uppercase;
            padding: 8px 4px;
        }
        .flag-text span { display: block; }

        .terminal-win {
            font-family: 'Tiny5', monospace;
            padding: 24px 20px;
            height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #808080;
            font-size: 1.1rem;
            line-height: 1.6;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .poem-line {
            margin: 12px auto;
            padding-left: 16px;
            transition: border-left-color 0.2s;
            max-width: 90%;
        }

        .win-button {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 12px 20px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: 0.03s linear, background 0.2s;
            color: #000;
        }
        .win-button:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            transform: translate(1px, 1px);
        }

        .modal-win {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.1s;
            z-index: 2000;
        }
        .modal-win.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-dialog {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            font-family: 'Tiny5', monospace;
        }
        .modal-dialog h3 {
            background: #000080;
            color: white;
            padding: 6px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-dialog p {
            background: #e0e0e0;
            padding: 12px;
            margin: 8px 0;
            word-break: break-word;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 6px 14px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
        }
        footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 20px;
            color: #000;
        }
        .hidden { display: none !important; }
        @media (max-width: 560px) {
            .fake-flag { width: 80px; height: 60px; font-size: 0.55rem; }
            .terminal-win { font-size: 0.85rem; height: 65vh; }
            .flags-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="win-app">
    <!-- Pantalla 1: banderas ficticias -->
    <div id="splashScreen" class="window">
        <div class="title-bar"><span>Galería de Banderas</span><span>⤡</span></div>
        <div class="window-content">
            <div style="text-align:center;"><div class="flags-title">✦ elegí tu bandera ✦</div></div>
            <div class="flags-row">
                <div class="fake-flag flag1" data-flag="1"></div>
                <div class="fake-flag flag2" data-flag="2"></div>
                <div class="fake-flag flag3" data-flag="3"></div>
                <div class="fake-flag flag4" data-flag="4"></div>
                <div class="fake-flag flag5" data-flag="5"></div>
                <div class="fake-flag flag-text" data-flag="poesia"><span>AQUI SE</span><span>ESTÁ</span><span>LEYENDO</span><span>POESÍA</span></div>
            </div>
            <footer>Windows 1.0 – Tiny5 edition</footer>
        </div>
    </div>

    <!-- Pantalla 2: carga con poema (centrado) -->
    <div id="loadingScreen" class="window hidden">
        <div class="title-bar"><span>Poema en carga</span><span>⎕</span></div>
        <div class="window-content" style="padding: 6px;">
            <div id="poemTerminal" class="terminal-win"></div>
        </div>
    </div>

    <!-- Pantalla 3: menú principal -->
    <div id="mainMenu" class="window hidden">
        <div class="title-bar"><span>LA CUESTIÓN - Menú</span><span>⎕</span></div>
        <div class="window-content" id="mainMenuContent">
            <div style="text-align:center; margin-bottom:20px;"><div id="menuTitle" style="background:#000080; color:white; padding:10px; font-size:1.3rem; letter-spacing:2px;">LA CUESTIÓN</div></div>
            <div style="display:flex; flex-direction:column; gap:20px; max-width:300px; margin:0 auto; width:100%;">
                <button id="btnUbicacion" class="win-button">📍 UBICACIÓN</button>
                <button id="btnEntradas" class="win-button">🎟️ ENTRADAS</button>
                <button id="btnPista" class="win-button">🔍 PISTA</button>
            </div>
            <footer style="margin-top:32px;">Latinoamérica unida por la poesía</footer>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modalWin" class="modal-win">
    <div class="modal-dialog">
        <h3 id="modalTitle">---</h3>
        <p id="modalMessage"></p>
        <div id="modalExtra" class="modal-buttons"></div>
        <div class="modal-buttons"><button id="closeModalBtn" class="modal-btn">Cerrar</button></div>
    </div>
</div>

<script>
    (function() {
        // ---------- PALETAS DE COLORES Y MÚSICA (cada bandera tiene su escala) ----------
        const colorSchemes = {
            '1': { bg: '#2c0a0a', text: '#ffcc00', accent: '#ff4d4d', titleBg: '#8b0000', titleText: '#ffcc66', windowBg: '#3a1a1a', contentBg: '#4a2a2a', buttonBg: '#8b3a3a', buttonBorder: '#ff9966', musicScale: [261.63, 329.63, 392.00, 523.25] }, // Do, Mi, Sol, Do (rojo)
            '2': { bg: '#0a2a4a', text: '#aaffff', accent: '#00aaff', titleBg: '#003366', titleText: '#ffffff', windowBg: '#1a3a5a', contentBg: '#2a4a6a', buttonBg: '#2a6a9a', buttonBorder: '#88ccff', musicScale: [293.66, 349.23, 440.00, 587.33] }, // Re, Fa, La, Re (azul)
            '3': { bg: '#2a0a2a', text: '#ffccff', accent: '#ff66cc', titleBg: '#660066', titleText: '#ffccff', windowBg: '#3a1a3a', contentBg: '#4a2a4a', buttonBg: '#8a3a8a', buttonBorder: '#ff88dd', musicScale: [329.63, 392.00, 493.88, 659.25] }, // Mi, Sol, Si, Mi (rosa)
            '4': { bg: '#1a3a1a', text: '#ccff66', accent: '#33cc33', titleBg: '#2d6a2d', titleText: '#ffff99', windowBg: '#2a4a2a', contentBg: '#3a5a3a', buttonBg: '#5a8a3a', buttonBorder: '#aaff66', musicScale: [196.00, 261.63, 329.63, 392.00] }, // Sol, Do, Mi, Sol (verde)
            '5': { bg: '#3a1a00', text: '#ffaa66', accent: '#ff6600', titleBg: '#a0522d', titleText: '#ffdd99', windowBg: '#4a2a10', contentBg: '#5a3a20', buttonBg: '#b86b2a', buttonBorder: '#ffaa66', musicScale: [220.00, 277.18, 369.99, 440.00] }, // La, Do#, Fa#, La (naranja)
            'poesia': { bg: '#1a1a2e', text: '#f5e6d3', accent: '#d4af37', titleBg: '#2c2c54', titleText: '#ffdf8c', windowBg: '#2a2a40', contentBg: '#3a3a55', buttonBg: '#4a3a6a', buttonBorder: '#e8c87a', musicScale: [261.63, 293.66, 330.00, 349.23, 392.00] } // escala de Do mayor (poesía)
        };

        let currentPalette = colorSchemes['1'];
        let currentMusic = null;      // AudioContext actual
        let musicActive = false;
        let musicLoopTimer = null;

        // ----- POEMA centrado -----
        const poemLines = [
            "y al final,",
            "un poco más tarde ke ahora,",
            "cuando estés volviendo a tu casa,",
            "mirarte y decir:",
            "hoy fue para mi.",
            "hoy, a este mundo,",
            "le robé una noche"
        ];

        // ----- SONIDO MÁQUINA DE ESCRIBIR (click suave) -----
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        function playTypeSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 1200 + Math.random() * 400;
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
            osc.start();
            osc.stop(now + 0.08);
        }

        // ----- MÚSICA DE FONDO POR BANDERA (bucle de acordes simples) -----
        function stopMusic() {
            if (musicLoopTimer) {
                clearInterval(musicLoopTimer);
                musicLoopTimer = null;
            }
            if (currentMusic) {
                // No podemos cerrar el contexto fácilmente, pero detenemos los osciladores activos
                if (currentMusic.oscList) {
                    currentMusic.oscList.forEach(osc => {
                        try { osc.stop(); } catch(e) {}
                    });
                }
                currentMusic = null;
            }
            musicActive = false;
        }

        function startMusicForFlag(flagId) {
            stopMusic();
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                // Esperar a que el usuario interactúe (ya lo hará al clickear la bandera)
                audioCtx.resume();
            }
            const scale = colorSchemes[flagId].musicScale;
            if (!scale || scale.length === 0) return;
            musicActive = true;
            let noteIndex = 0;
            const playNote = () => {
                if (!musicActive) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = scale[noteIndex % scale.length];
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                osc.start();
                osc.stop(now + 1.2);
                // Guardar para poder detener después (opcional)
                if (!currentMusic) currentMusic = { oscList: [] };
                currentMusic.oscList.push(osc);
                noteIndex++;
                if (noteIndex >= scale.length * 2) noteIndex = 0;
            };
            // Repetir cada 1.6 segundos
            musicLoopTimer = setInterval(playNote, 1600);
            // También tocar una nota inicial
            playNote();
        }

        // ----- APLICAR PALETA A PANTALLAS -----
        function applyPaletteToLoading() {
            const terminal = document.getElementById('poemTerminal');
            if (terminal) {
                terminal.style.backgroundColor = currentPalette.bg;
                terminal.style.color = currentPalette.text;
                terminal.style.borderColor = currentPalette.accent;
            }
            const loadingTitle = loadingDiv.querySelector('.title-bar');
            if (loadingTitle) loadingTitle.style.background = currentPalette.titleBg;
            const loadingContent = loadingDiv.querySelector('.window-content');
            if (loadingContent) loadingContent.style.backgroundColor = currentPalette.contentBg;
        }

        function applyPaletteToMenu() {
            const menuWindow = mainMenuDiv;
            if (!menuWindow) return;
            const titleBar = menuWindow.querySelector('.title-bar');
            if (titleBar) titleBar.style.background = currentPalette.titleBg;
            const contentDiv = document.getElementById('mainMenuContent');
            if (contentDiv) contentDiv.style.backgroundColor = currentPalette.contentBg;
            const menuTitle = document.getElementById('menuTitle');
            if (menuTitle) {
                menuTitle.style.background = currentPalette.titleBg;
                menuTitle.style.color = currentPalette.titleText;
            }
            const buttons = menuWindow.querySelectorAll('.win-button');
            buttons.forEach(btn => {
                btn.style.backgroundColor = currentPalette.buttonBg;
                btn.style.color = currentPalette.text;
                btn.style.borderTopColor = currentPalette.buttonBorder;
                btn.style.borderLeftColor = currentPalette.buttonBorder;
                btn.style.borderRightColor = '#808080';
                btn.style.borderBottomColor = '#808080';
            });
            const footer = menuWindow.querySelector('footer');
            if (footer) footer.style.color = currentPalette.accent;
        }

        // ----- EFECTO MÁQUINA DE ESCRIBIR CON SONIDO Y CENTRADO -----
        let typingInterval = null;
        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let currentLineElement = null;

        function startPoemTyping(callback) {
            const terminal = document.getElementById('poemTerminal');
            terminal.innerHTML = '';
            currentLineIndex = 0;
            currentCharIndex = 0;
            applyPaletteToLoading();
            // Asegurar que el contenedor tenga flex para centrar
            terminal.style.display = 'flex';
            terminal.style.flexDirection = 'column';
            terminal.style.justifyContent = 'center';
            terminal.style.alignItems = 'center';

            function typeNextChar() {
                if (currentLineIndex >= poemLines.length) {
                    if (typingInterval) clearInterval(typingInterval);
                    if (callback) callback();
                    return;
                }
                const line = poemLines[currentLineIndex];
                if (currentCharIndex === 0) {
                    currentLineElement = document.createElement('p');
                    currentLineElement.className = 'poem-line';
                    currentLineElement.style.borderLeftColor = currentPalette.accent;
                    currentLineElement.style.textAlign = 'center';
                    currentLineElement.style.width = '100%';
                    currentLineElement.textContent = '';
                    terminal.appendChild(currentLineElement);
                    terminal.scrollTop = terminal.scrollHeight;
                }
                if (currentCharIndex < line.length) {
                    currentLineElement.textContent += line[currentCharIndex];
                    currentCharIndex++;
                    terminal.scrollTop = terminal.scrollHeight;
                    // Sonido de máquina de escribir
                    playTypeSound();
                } else {
                    currentLineIndex++;
                    currentCharIndex = 0;
                    currentLineElement = null;
                }
            }
            typingInterval = setInterval(typeNextChar, 70);
        }

        function stopTyping() {
            if (typingInterval) clearInterval(typingInterval);
            typingInterval = null;
        }

        // ----- CARGA Y TRANSICIÓN -----
        let loadingActive = false;
        function startLoading(flagId) {
            if (loadingActive) return;
            loadingActive = true;
            // Iniciar música según bandera
            startMusicForFlag(flagId);
            splashDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            mainMenuDiv.classList.add('hidden');
            startPoemTyping(() => {
                setTimeout(() => {
                    finishLoading();
                }, 1500);
            });
        }

        function finishLoading() {
            stopTyping();
            loadingDiv.classList.add('hidden');
            mainMenuDiv.classList.remove('hidden');
            applyPaletteToMenu();
            loadingActive = false;
            // La música sigue sonando mientras esté en el menú (se detendrá si se elige otra bandera? No, solo al iniciar nueva)
            // La dejamos sonando hasta que se salga de la página o se elija otra bandera (no aplica porque ya no se puede)
        }

        // ----- EVENTOS DE BANDERAS -----
        const flags = document.querySelectorAll('.fake-flag');
        flags.forEach(flag => {
            flag.addEventListener('click', (e) => {
                e.stopPropagation();
                let flagId = flag.getAttribute('data-flag');
                if (!flagId || !colorSchemes[flagId]) flagId = '1';
                currentPalette = colorSchemes[flagId];
                // Iniciar la carga con la bandera elegida
                if (!splashDiv.classList.contains('hidden')) {
                    startLoading(flagId);
                }
            });
        });

        // ----- ELEMENTOS DOM -----
        const splashDiv = document.getElementById('splashScreen');
        const loadingDiv = document.getElementById('loadingScreen');
        const mainMenuDiv = document.getElementById('mainMenu');
        const modal = document.getElementById('modalWin');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalExtra = document.getElementById('modalExtra');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function closeModal() {
            modal.classList.remove('active');
            modalExtra.innerHTML = '';
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

        // ----- BOTONES MENÚ -----
        document.getElementById('btnUbicacion').addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/?api=1&query=Centro+de+Poesía+Buenos+Aires', '_blank');
        });

        document.getElementById('btnEntradas').addEventListener('click', (e) => {
            e.preventDefault();
            const alias = "ellorenzopa.banda";
            const monto = "4000";
            modalTitle.innerText = "Entradas - $4000";
            modalMessage.innerText = `Alias: ${alias}\nMonto: ARS ${monto}\n\nElegí una opción:`;
            modalExtra.innerHTML = '';

            const btnOpenMP = document.createElement('button');
            btnOpenMP.innerText = "Abrir Mercado Pago (App)";
            btnOpenMP.classList.add('modal-btn');
            btnOpenMP.addEventListener('click', () => {
                // Abrir en nueva pestaña sin reemplazar nuestra página
                window.open('https://www.mercadopago.com.ar/transferencias', '_blank');
                closeModal();
            });

            const btnCopy = document.createElement('button');
            btnCopy.innerText = "Copiar Alias";
            btnCopy.classList.add('modal-btn');
            btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(alias).then(() => {
                    showToast("Alias copiado: " + alias);
                }).catch(() => {
                    alert("Copiá manual: " + alias);
                });
            });
            modalExtra.appendChild(btnOpenMP);
            modalExtra.appendChild(btnCopy);
            modal.classList.add('active');
        });

        document.getElementById('btnPista').addEventListener('click', () => {
            modalTitle.innerText = "Pista Oculta";
            modalMessage.innerText = '"seremos el centro del temblor"';
            modalExtra.innerHTML = '';
            const okBtn = document.createElement('button');
            okBtn.innerText = "Entendido";
            okBtn.classList.add('modal-btn');
            okBtn.addEventListener('click', closeModal);
            modalExtra.appendChild(okBtn);
            modal.classList.add('active');
        });

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '40px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#ffffcc';
            toast.style.color = '#000';
            toast.style.padding = '8px 16px';
            toast.style.fontFamily = 'Tiny5, monospace';
            toast.style.border = '2px solid #000';
            toast.style.zIndex = '10000';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Inicializar audio al primer clic en bandera (la interacción del usuario activa el audio)
        // También, por si acaso, precargamos contexto silencioso al cargar la página
        window.addEventListener('load', () => {
            // No iniciamos audio automáticamente, esperamos el click
        });
    })();
