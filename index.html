<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LA CUESTIÓN · Bandera tuya</title>
    <!-- Fuente Tiny5 (pixelada) -->
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #008080;
            font-family: 'Tiny5', 'Courier New', monospace;
            min-height: 100vh;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-app {
            width: 100%;
            height: 100vh;
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            box-shadow: 2px 2px 0px #00000066;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Tiny5', monospace;
            flex-shrink: 0;
        }

        .window-content {
            padding: 16px;
            border: 1px solid #808080;
            margin: 2px;
            background: #c0c0c0;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .win-button {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 12px 20px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: 0.03s linear;
            color: #000;
        }
        .win-button:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            transform: translate(1px, 1px);
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 360px;
            height: auto;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background: #c0c0c0;
            border: 1px solid #808080;
        }

        /* Selector de banderas */
        .flag-selector {
            margin: 20px auto;
            text-align: center;
        }
        .flag-title {
            font-family: 'Tiny5', monospace;
            font-size: 0.9rem;
            margin-bottom: 12px;
            background: #000080;
            color: white;
            display: inline-block;
            padding: 4px 12px;
        }
        .flags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }
        .flag-item {
            width: 52px;
            height: 36px;
            border: 2px solid #808080;
            cursor: pointer;
            transition: all 0.05s linear;
            image-rendering: pixelated;
        }
        .flag-item:active {
            transform: scale(0.96);
        }
        .flag-item.selected {
            border: 4px solid #ffff00;
            box-shadow: 0 0 0 2px #000;
        }

        /* Terminal de carga con fondo dinámico */
        .terminal-win {
            font-family: 'Tiny5', monospace;
            padding: 16px;
            height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #808080;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .terminal-win p {
            margin: 8px 0;
            border-left: 2px solid currentColor;
            padding-left: 10px;
        }

        .modal-win {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.1s;
            z-index: 2000;
        }
        .modal-win.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-dialog {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            font-family: 'Tiny5', monospace;
        }
        .modal-dialog h3 {
            background: #000080;
            color: white;
            padding: 6px;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-dialog p {
            background: #e0e0e0;
            padding: 12px;
            margin: 8px 0;
            word-break: break-word;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 6px 14px;
            font-family: 'Tiny5', monospace;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-btn:active {
            border-top-color: #808080;
            border-left-color: #808080;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
        }
        footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 24px;
            color: #000;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 560px) {
            .win-button { font-size: 0.8rem; padding: 10px 12px; }
            .terminal-win { font-size: 0.7rem; height: 65vh; }
            .flag-item { width: 44px; height: 30px; }
        }
    </style>
</head>
<body>
<div class="win-app">
    <!-- Pantalla 1: mástil + bandera + selector -->
    <div id="splashScreen" class="window">
        <div class="title-bar"><span>Pabellón de Poesía</span><span>⤡</span></div>
        <div class="window-content">
            <canvas id="flagCanvas" width="320" height="240" style="width:100%; max-width:360px; aspect-ratio:320/240"></canvas>
            
            <div class="flag-selector">
                <div class="flag-title">✦ elegí tu bandera ✦</div>
                <div class="flags-container" id="flagsContainer"></div>
            </div>
            
            <button id="btnEmpezar" class="win-button" style="width:100%; margin-top:16px;">▶ EMPEZAR</button>
            <footer>Windows 1.0 – Tiny5 edition</footer>
        </div>
    </div>

    <!-- Pantalla 2: carga con colores de la bandera elegida -->
    <div id="loadingScreen" class="window hidden">
        <div class="title-bar"><span>MS-DOS Prompt</span><span>⎕</span></div>
        <div class="window-content" style="padding: 6px;">
            <div id="terminalBox" class="terminal-win"></div>
        </div>
    </div>

    <!-- Pantalla 3: menú principal -->
    <div id="mainMenu" class="window hidden">
        <div class="title-bar"><span>LA CUESTIÓN - Menú</span><span>⎕</span></div>
        <div class="window-content">
            <div style="text-align:center; margin-bottom:20px;">
                <div style="background:#000080; color:white; padding:10px; font-size:1.3rem; letter-spacing:2px;">LA CUESTIÓN</div>
            </div>
            <div style="display:flex; flex-direction:column; gap:20px; max-width:300px; margin:0 auto; width:100%;">
                <button id="btnUbicacion" class="win-button">📍 UBICACIÓN</button>
                <button id="btnEntradas" class="win-button">🎟️ ENTRADAS</button>
                <button id="btnPista" class="win-button">🔍 PISTA</button>
            </div>
            <footer style="margin-top:32px;">Latinoamérica unida por la poesía</footer>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modalWin" class="modal-win">
    <div class="modal-dialog">
        <h3 id="modalTitle">---</h3>
        <p id="modalMessage"></p>
        <div id="modalExtra" class="modal-buttons"></div>
        <div class="modal-buttons">
            <button id="closeModalBtn" class="modal-btn">Cerrar</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DEFINICIÓN DE BANDERAS (colores representativos) ----------
        const flags = {
            argentina: { name: "Argentina", colors: ["#75aadb", "#ffffff", "#f0c13a"], bgGradient: "linear-gradient(180deg, #75aadb 33%, #ffffff 33%, #ffffff 66%, #f0c13a 66%)" },
            mexico: { name: "México", colors: ["#006847", "#ffffff", "#ce1126"], bgGradient: "linear-gradient(90deg, #006847 33%, #ffffff 33%, #ffffff 66%, #ce1126 66%)" },
            colombia: { name: "Colombia", colors: ["#fcd116", "#003893", "#ce1126"], bgGradient: "linear-gradient(180deg, #fcd116 50%, #003893 25%, #ce1126 25%)" },
            peru: { name: "Perú", colors: ["#d91023", "#ffffff", "#d91023"], bgGradient: "linear-gradient(90deg, #d91023 33%, #ffffff 33%, #ffffff 66%, #d91023 66%)" },
            chile: { name: "Chile", colors: ["#ffffff", "#0039a6", "#d52b1e"], bgGradient: "linear-gradient(180deg, #ffffff 50%, #0039a6 25%, #d52b1e 25%)" },
            uruguay: { name: "Uruguay", colors: ["#ffffff", "#0038a8", "#fcd116"], bgGradient: "repeating-linear-gradient(180deg, #ffffff 0px, #ffffff 30px, #0038a8 30px, #0038a8 60px)" }
        };
        
        let selectedFlagId = "argentina";  // por defecto
        let flagColors = flags.argentina.colors;
        
        // Renderizar mini banderas
        const flagsContainer = document.getElementById('flagsContainer');
        function renderFlagSelectors() {
            flagsContainer.innerHTML = '';
            for (const [id, data] of Object.entries(flags)) {
                const flagDiv = document.createElement('div');
                flagDiv.className = 'flag-item';
                if (id === selectedFlagId) flagDiv.classList.add('selected');
                flagDiv.style.background = data.bgGradient;
                flagDiv.style.backgroundSize = 'cover';
                flagDiv.style.border = '2px solid #000';
                flagDiv.title = data.name;
                flagDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedFlagId = id;
                    flagColors = flags[id].colors;
                    // actualizar borde seleccionado
                    document.querySelectorAll('.flag-item').forEach(el => el.classList.remove('selected'));
                    flagDiv.classList.add('selected');
                });
                flagsContainer.appendChild(flagDiv);
            }
        }
        renderFlagSelectors();
        
        // ---------- CANVAS: mástil y bandera flameante (sin cambios, solo fondo) ----------
        const canvas = document.getElementById('flagCanvas');
        let animFrame = 0;
        let animInterval = null;
        
        function drawFlag(frame) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = 320, h = 240;
            canvas.width = w;
            canvas.height = h;
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(0, 0, w, h);
            // pasto base
            for (let i=0; i<w/4; i++) {
                ctx.fillStyle = (i%2) ? '#2d6a2d' : '#1f4f1f';
                ctx.fillRect(i*4, h-28, 4, 28);
            }
            // mástil
            const mastilX = 100;
            const mastilW = 12;
            const mastilH = 140;
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(mastilX, 40, mastilW, mastilH);
            ctx.fillStyle = '#c2823a';
            for (let y = 40; y < 40+mastilH; y+=8) {
                ctx.fillRect(mastilX+3, y, 3, 4);
                ctx.fillRect(mastilX+7, y+4, 3, 4);
            }
            ctx.fillStyle = '#e5b83c';
            ctx.fillRect(mastilX-4, 28, 20, 12);
            ctx.fillStyle = '#b47a22';
            ctx.fillRect(mastilX-2, 22, 16, 6);
            // bandera blanca con texto
            const flagX = mastilX + mastilW;
            const flagY = 44;
            const ancho = 140;
            const alto = 56;
            ctx.fillStyle = '#fffbe6';
            ctx.fillRect(flagX, flagY, ancho, alto);
            ctx.fillStyle = '#1f1a10';
            ctx.strokeRect(flagX, flagY, ancho, alto);
            // flameo
            for (let seg = 0; seg < 5; seg++) {
                let offsetY = flagY+alto - 5 + Math.sin(seg * 1.1 + frame * 0.4) * 2 | 0;
                ctx.fillStyle = '#fffbe6';
                ctx.fillRect(flagX + seg*26, offsetY, 24, 6);
                ctx.fillStyle = '#1f1a10';
                ctx.fillRect(flagX + seg*26, offsetY, 24, 2);
            }
            ctx.font = 'bold 9px "Tiny5", monospace';
            ctx.fillStyle = '#000';
            ctx.fillText("AQUI SE ESTA", flagX+22, flagY+20);
            ctx.fillText("LEYENDO", flagX+36, flagY+36);
            ctx.fillText("POESIA", flagX+44, flagY+52);
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(flagX+ancho-12, flagY+8, 5,5);
            ctx.fillRect(flagX+ancho-24, flagY+22, 5,5);
        }
        
        function startFlagAnimation() {
            if (animInterval) clearInterval(animInterval);
            let f = 0;
            animInterval = setInterval(() => { drawFlag(f++); }, 150);
        }
        if (canvas) startFlagAnimation();
        
        // ---------- CONTROL DE PANTALLAS CON COLORES DE BANDERA ----------
        const splashDiv = document.getElementById('splashScreen');
        const loadingDiv = document.getElementById('loadingScreen');
        const mainMenuDiv = document.getElementById('mainMenu');
        const empezarBtn = document.getElementById('btnEmpezar');
        const terminalDiv = document.getElementById('terminalBox');
        const modal = document.getElementById('modalWin');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalExtra = document.getElementById('modalExtra');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        function closeModal() {
            modal.classList.remove('active');
            modalExtra.innerHTML = '';
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
        
        let intervals = [];
        function clearAllIntervals() {
            intervals.forEach(i => clearInterval(i));
            intervals = [];
        }
        
        // CARGA con fondos de los colores de la bandera elegida
        function startLoading() {
            splashDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            mainMenuDiv.classList.add('hidden');
            terminalDiv.innerHTML = '';
            
            // aplicar colores de la bandera al fondo del terminal
            const gradient = flags[selectedFlagId].bgGradient;
            terminalDiv.style.background = gradient;
            terminalDiv.style.color = '#000'; // texto oscuro para contraste
            terminalDiv.style.textShadow = 'none';
            // ajustar color de borde
            terminalDiv.style.borderLeft = `4px solid ${flagColors[0]}`;
            
            const baseMsg = "> la cuestión está sucediendo en este momento";
            const variants = [
                "[SYS] la cuestión está sucediendo en este momento",
                "[KERNEL] la cuestión está sucediendo en este momento",
                "[PROCESO] la cuestión está sucediendo en este momento",
                `[${flags[selectedFlagId].name.toUpperCase()}] la cuestión está sucediendo en este momento`
            ];
            let lineCount = 0;
            function addLine() {
                if (loadingDiv.classList.contains('hidden')) return;
                const p = document.createElement('p');
                let text = (lineCount % 3 === 0) ? variants[lineCount % variants.length] : baseMsg + " [" + Math.floor(Math.random()*0xFFF).toString(16) + "]";
                p.textContent = text;
                p.style.borderLeftColor = flagColors[lineCount % flagColors.length];
                terminalDiv.appendChild(p);
                terminalDiv.scrollTop = terminalDiv.scrollHeight;
                lineCount++;
                if (terminalDiv.children.length > 80) {
                    for(let i=0; i<20; i++) if(terminalDiv.firstChild) terminalDiv.removeChild(terminalDiv.firstChild);
                }
            }
            const fast = setInterval(addLine, 30);
            intervals.push(fast);
            setTimeout(() => {
                clearInterval(fast);
                const slow = setInterval(addLine, 100);
                intervals.push(slow);
                setTimeout(() => {
                    clearInterval(slow);
                    finishLoading();
                }, 2500);
            }, 2000);
            const safety = setTimeout(() => finishLoading(), 5500);
            intervals.push(safety);
        }
        
        function finishLoading() {
            clearAllIntervals();
            loadingDiv.classList.add('hidden');
            mainMenuDiv.classList.remove('hidden');
            terminalDiv.innerHTML = '';
            terminalDiv.style.background = ''; // reset
            terminalDiv.style.color = '';
        }
        
        empezarBtn.addEventListener('click', () => {
            if (!splashDiv.classList.contains('hidden')) startLoading();
        });
        
        // ---------- BOTONES DEL MENÚ ----------
        document.getElementById('btnUbicacion').addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/?api=1&query=Centro+de+Poesía+Buenos+Aires', '_blank');
        });
        
        // ENTRADAS: CORREGIDO - abre Mercado Pago sin errores
        document.getElementById('btnEntradas').addEventListener('click', (e) => {
            e.preventDefault();
            const alias = "ellorenzopa.banda";
            const monto = "4000";
            modalTitle.innerText = "Entradas - $4000";
            modalMessage.innerText = `Alias: ${alias}\nMonto: ARS ${monto}\n\nElegí una opción:`;
            modalExtra.innerHTML = '';
            
            const btnOpenMP = document.createElement('button');
            btnOpenMP.innerText = "Abrir Mercado Pago";
            btnOpenMP.classList.add('modal-btn');
            btnOpenMP.addEventListener('click', () => {
                // Corrección: usar window.open con _blank y sin rel conflictivo
                window.open('https://www.mercadopago.com.ar/transferencias', '_blank', 'noopener,noreferrer');
                closeModal();
            });
            
            const btnCopy = document.createElement('button');
            btnCopy.innerText = "Copiar Alias";
            btnCopy.classList.add('modal-btn');
            btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(alias).then(() => {
                    showToast("Alias copiado: " + alias);
                }).catch(() => {
                    alert("Copiá manual: " + alias);
                });
            });
            
            modalExtra.appendChild(btnOpenMP);
            modalExtra.appendChild(btnCopy);
            modal.classList.add('active');
        });
        
        document.getElementById('btnPista').addEventListener('click', () => {
            modalTitle.innerText = "Pista Oculta";
            modalMessage.innerText = '"seremos el centro del temblor"';
            modalExtra.innerHTML = '';
            const okBtn = document.createElement('button');
            okBtn.innerText = "Entendido";
            okBtn.classList.add('modal-btn');
            okBtn.addEventListener('click', closeModal);
            modalExtra.appendChild(okBtn);
            modal.classList.add('active');
        });
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '40px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#ffffcc';
            toast.style.color = '#000';
            toast.style.padding = '8px 16px';
            toast.style.fontFamily = 'Tiny5, monospace';
            toast.style.border = '2px solid #000';
            toast.style.zIndex = '10000';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    })();
</script>
</body>
</html>
