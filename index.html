<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LA CUESTIÓN · ULTRA PIXEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: pixelated;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            padding: 8px;
        }
        /* Contenedor principal con escala extrema */
        .pixel-world {
            width: 100%;
            max-width: 500px;
            background: #000;
            border: 4px solid #fff;
            image-rendering: crisp-edges;
        }
        /* Pantallas */
        .screen {
            width: 100%;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: #0c1a0c;
        }
        .hidden {
            display: none !important;
        }
        /* Fondo ultra pixel (patrón de 8x8) */
        .bg-grass {
            background: #2d6a2d;
            background-image: repeating-linear-gradient(0deg, #1f4f1f 0px, #1f4f1f 8px, #2d6a2d 8px, #2d6a2d 16px);
        }
        .bg-violet {
            background: #6a1f6a;
            background-image: repeating-linear-gradient(45deg, #b438b4 0px, #b438b4 8px, #3eff3e 8px, #3eff3e 16px);
        }
        /* CANVAS de muy baja resolución (160x144) escalado */
        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 400px;
            height: auto;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background: transparent;
            border: 2px solid #fff;
        }
        /* Botones toscos */
        .pixel-btn-big {
            background: #1a1f1a;
            border: 4px solid #f7e05e;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 12px 8px;
            color: #f7e05e;
            text-align: center;
            width: 90%;
            max-width: 260px;
            margin: 16px auto;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            transition: 0.03s linear;
            letter-spacing: 2px;
        }
        .pixel-btn-big:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 #000;
        }
        /* Terminal de carga */
        .terminal {
            background: #001200;
            padding: 20px 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #3eff6e;
            height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 4px solid #6eff6e;
        }
        .terminal p {
            margin: 8px 0;
            border-left: 2px solid #6eff6e;
            padding-left: 8px;
        }
        /* Menú */
        .menu-pixel {
            width: 100%;
            text-align: center;
        }
        .title-pixel {
            font-family: 'Courier New', monospace;
            font-size: 1.6rem;
            background: #000;
            color: #fdcc4a;
            padding: 12px;
            margin: 20px 0;
            border: 4px solid #fdcc4a;
            display: inline-block;
            letter-spacing: 2px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin: 20px 0;
        }
        .menu-btn {
            background: #111;
            border: 4px solid #ffeaaf;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem;
            padding: 14px 8px;
            color: #ffeaaf;
            text-align: center;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            transition: 0.03s linear;
        }
        .menu-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 #000;
        }
        footer {
            font-size: 0.5rem;
            color: #aaa;
            margin-top: 24px;
            text-align: center;
        }
        /* Modal ultra pixel */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000cc;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.1s;
            z-index: 2000;
        }
        .modal.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-box {
            background: #131008;
            border: 6px solid #fbb13c;
            padding: 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .modal-box h3 {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            color: #fbb13c;
            margin-bottom: 16px;
        }
        .modal-box p {
            background: #242018;
            padding: 12px;
            color: #f7e7b4;
            font-family: monospace;
            font-size: 0.7rem;
            border-left: 4px solid #fea82f;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #2e2a1f;
            border: none;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.7rem;
            padding: 8px 16px;
            color: #ffdf93;
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
        }
        .modal-btn:active {
            transform: translate(2px,2px);
            box-shadow: 1px 1px 0 #000;
        }
        @media (max-width: 500px) {
            .pixel-btn-big { font-size: 1rem; }
            .title-pixel { font-size: 1rem; }
            .menu-btn { font-size: 0.7rem; }
            .terminal { font-size: 0.5rem; }
        }
    </style>
</head>
<body>
<div class="pixel-world">
    <!-- PANTALLA INICIAL (pasto verde) -->
    <div id="splashScreen" class="screen bg-grass">
        <canvas id="pixelCanvas" width="160" height="144" style="width:100%; max-width:320px; aspect-ratio:160/144"></canvas>
        <button id="btnEmpezar" class="pixel-btn-big">► EMPEZAR</button>
        <footer>8-BIT EXTREMO</footer>
    </div>

    <!-- PANTALLA DE CARGA (computadora) -->
    <div id="loadingScreen" class="screen bg-grass hidden">
        <div id="terminalText" class="terminal"></div>
    </div>

    <!-- MENÚ PRINCIPAL (pasto violeta + flúor) -->
    <div id="mainMenu" class="screen bg-violet hidden">
        <div class="menu-pixel">
            <div class="title-pixel">LA CUESTIÓN</div>
            <div class="menu-buttons">
                <button id="btnUbicacion" class="menu-btn">📍 UBICACIÓN</button>
                <button id="btnEntradas" class="menu-btn">🎟️ ENTRADAS</button>
                <button id="btnPista" class="menu-btn">🔍 PISTA</button>
            </div>
            <footer>✦ PIXEL DURO ✦</footer>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="pixelModal" class="modal">
    <div class="modal-box">
        <h3 id="modalTitle">---</h3>
        <p id="modalMessage"></p>
        <div id="modalExtraButtons" class="modal-btns"></div>
        <div class="modal-btns">
            <button id="closeModalBtn" class="modal-btn">CERRAR</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- CANVAS PIXEL EXTREMO: mástil + bandera flameante (pixel a pixel) ----------
        const canvas = document.getElementById('pixelCanvas');
        let animFrame = 0;
        let animInterval = null;
        
        function drawPixelMastil(frame) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = 160, h = 144;
            canvas.width = w;
            canvas.height = h;
            ctx.imageSmoothingEnabled = false;
            
            // Fondo pasto pixel (verde)
            for (let i = 0; i < w/4; i++) {
                for (let j = 0; j < h/4; j++) {
                    ctx.fillStyle = (i+j)%2 === 0 ? '#2a8a2a' : '#1a5a1a';
                    ctx.fillRect(i*4, j*4, 4, 4);
                }
            }
            
            // Mástil (bloques de 4x4)
            const mastilX = 60;
            const mastilW = 8;
            const mastilH = 80;
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(mastilX, 28, mastilW, mastilH);
            ctx.fillStyle = '#c2823a';
            for (let y = 28; y < 28+mastilH; y+=6) {
                ctx.fillRect(mastilX+2, y, 2, 3);
                ctx.fillRect(mastilX+4, y+3, 2, 3);
            }
            // bola
            ctx.fillStyle = '#e5b83c';
            ctx.fillRect(mastilX-4, 20, 16, 8);
            ctx.fillStyle = '#b47a22';
            ctx.fillRect(mastilX-2, 16, 12, 4);
            
            // Bandera blanca (ondeo con frame)
            const flagX = mastilX + mastilW;
            const flagY = 24;
            const ancho = 68;
            const alto = 36;
            ctx.fillStyle = '#fffbe6';
            ctx.fillRect(flagX, flagY, ancho, alto);
            ctx.fillStyle = '#1f1a10';
            ctx.strokeRect(flagX, flagY, ancho, alto);
            // Flameo pixelado: el borde inferior sube y baja
            const t = frame % 12;
            for (let seg = 0; seg < 4; seg++) {
                const offsetY = flagY+alto - 4 - (Math.sin(seg * 1.2 + frame * 0.4) * 2 | 0);
                ctx.fillStyle = '#fffbe6';
                ctx.fillRect(flagX + seg*16, offsetY, 14, 6);
                ctx.fillStyle = '#1f1a10';
                ctx.fillRect(flagX + seg*16, offsetY, 14, 2);
            }
            // Texto pixel (4px de alto)
            ctx.font = 'bold 6px "Courier New", monospace';
            ctx.fillStyle = '#000';
            ctx.fillText("AQUI", flagX+8, flagY+12);
            ctx.fillText("SE", flagX+28, flagY+12);
            ctx.fillText("ESTA", flagX+44, flagY+12);
            ctx.fillText("LEYENDO", flagX+12, flagY+26);
            ctx.fillText("POESIA", flagX+22, flagY+38);
            // estrella
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(flagX+ancho-10, flagY+6, 4,4);
        }
        
        function startAnimation() {
            if (animInterval) clearInterval(animInterval);
            let frame = 0;
            animInterval = setInterval(() => {
                drawPixelMastil(frame++);
            }, 150);
        }
        if (canvas) startAnimation();
        
        // ---------- CONTROL DE PANTALLAS ----------
        const splash = document.getElementById('splashScreen');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainMenu = document.getElementById('mainMenu');
        const empezarBtn = document.getElementById('btnEmpezar');
        const terminalDiv = document.getElementById('terminalText');
        const modal = document.getElementById('pixelModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalExtra = document.getElementById('modalExtraButtons');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        function closeModal() {
            modal.classList.remove('active');
            modalExtra.innerHTML = '';
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
        
        let timers = [];
        function limpiarTimers() {
            timers.forEach(t => clearInterval(t));
            timers = [];
        }
        
        function iniciarCarga() {
            splash.classList.add('hidden');
            loadingScreen.classList.remove('hidden');
            mainMenu.classList.add('hidden');
            terminalDiv.innerHTML = '';
            const base = "> la cuestión está sucediendo en este momento";
            const codes = ["[SYS]","[KERNEL]","[PROC]","[MEM]","[POESIA]"];
            let count = 0;
            function addLine() {
                if (loadingScreen.classList.contains('hidden')) return;
                const p = document.createElement('p');
                let txt = (count%2 === 0) ? codes[count%codes.length] + " " + base : base + " [" + Math.floor(Math.random()*0xFF).toString(16) + "]";
                p.textContent = txt;
                terminalDiv.appendChild(p);
                terminalDiv.scrollTop = terminalDiv.scrollHeight;
                count++;
                if (terminalDiv.children.length > 80) {
                    while(terminalDiv.children.length > 60) terminalDiv.removeChild(terminalDiv.firstChild);
                }
            }
            const rapid = setInterval(addLine, 25);
            timers.push(rapid);
            setTimeout(() => {
                clearInterval(rapid);
                const slow = setInterval(addLine, 90);
                timers.push(slow);
                setTimeout(() => {
                    clearInterval(slow);
                    finalizar();
                }, 2400);
            }, 2000);
            const safety = setTimeout(finalizar, 5000);
            timers.push(safety);
        }
        
        function finalizar() {
            limpiarTimers();
            loadingScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            terminalDiv.innerHTML = '';
        }
        
        empezarBtn.addEventListener('click', () => {
            if (!splash.classList.contains('hidden')) iniciarCarga();
        });
        
        // Botones menú
        document.getElementById('btnUbicacion').addEventListener('click', () => {
            window.open('https://www.google.com/maps/search/?api=1&query=Centro+de+Poesía+Buenos+Aires', '_blank');
        });
        
        document.getElementById('btnEntradas').addEventListener('click', (e) => {
            e.preventDefault();
            const alias = "ellorenzopa.banda";
            const monto = "4000";
            modalTitle.innerText = "ENTRADA $4000";
            modalMessage.innerText = `Alias: ${alias}\nMonto: $${monto}\nElegí:`;
            modalExtra.innerHTML = '';
            const mpBtn = document.createElement('button');
            mpBtn.innerText = "MERCADO PAGO";
            mpBtn.classList.add('modal-btn');
            mpBtn.addEventListener('click', () => {
                window.open('https://www.mercadopago.com.ar/transferencias', '_blank');
                closeModal();
            });
            const copyBtn = document.createElement('button');
            copyBtn.innerText = "COPIAR ALIAS";
            copyBtn.classList.add('modal-btn');
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(alias).then(() => {
                    toastPixel("Alias copiado!");
                }).catch(() => alert(alias));
            });
            modalExtra.appendChild(mpBtn);
            modalExtra.appendChild(copyBtn);
            modal.classList.add('active');
        });
        
        document.getElementById('btnPista').addEventListener('click', () => {
            modalTitle.innerText = "PISTA";
            modalMessage.innerText = '"seremos el centro del temblor"';
            modalExtra.innerHTML = '';
            const ok = document.createElement('button');
            ok.innerText = "OK";
            ok.classList.add('modal-btn');
            ok.addEventListener('click', closeModal);
            modalExtra.appendChild(ok);
            modal.classList.add('active');
        });
        
        function toastPixel(msg) {
            const t = document.createElement('div');
            t.innerText = msg;
            t.style.position = 'fixed';
            t.style.bottom = '40px';
            t.style.left = '50%';
            t.style.transform = 'translateX(-50%)';
            t.style.backgroundColor = '#000';
            t.style.color = '#fbe86e';
            t.style.padding = '10px 16px';
            t.style.fontFamily = 'Courier New, monospace';
            t.style.fontWeight = 'bold';
            t.style.fontSize = '0.8rem';
            t.style.border = '4px solid #ffb347';
            t.style.zIndex = '10000';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
    })();
</script>
</body>
</html>
