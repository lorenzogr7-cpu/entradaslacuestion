<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LA CUESTIÓN · JUNIO</title>
    <!-- Fuentes: Alumni Sans para texto, Bungee para títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,400;0,700;1,400&family=Bungee&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            font-family: 'Alumni Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: black;
        }

        .screen {
            width: 100%;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            background: black;
            color: white;
        }
        .hidden {
            display: none !important;
        }

        .title-lg {
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            text-align: center;
            color: white;
            margin-bottom: 32px;
            letter-spacing: 2px;
            font-weight: normal;
        }

        /* Grid de banderas - sin relieve, planas */
        .flags-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 20px;
        }
        .flag-card {
            width: 120px;
            background: black;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid #333;
        }
        .flag-card:active {
            transform: scale(0.96);
            background: #111;
        }
        .flag-preview {
            width: 80px;
            height: 60px;
            margin: 0 auto 12px;
            border: 1px solid #444;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.55rem;
            font-family: 'Alumni Sans', monospace;
            font-weight: bold;
            line-height: 1.2;
            word-break: break-word;
            color: black;
            background-color: #fffbe6;
        }
        .flag-card span {
            font-family: 'Alumni Sans', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #ccc;
        }

        /* Estilos de banderas (solo fondo del preview) */
        .flag1 .flag-preview { background: linear-gradient(135deg, #ff4d4d 50%, #ffcc00 50%); background-color: unset; }
        .flag2 .flag-preview { background: repeating-linear-gradient(90deg, #00aaff, #00aaff 20px, #ffffff 20px, #ffffff 40px); background-color: unset; }
        .flag3 .flag-preview { background: radial-gradient(circle at 30% 40%, #ff66cc, #9933ff); background-color: unset; }
        .flag4 .flag-preview { background: repeating-linear-gradient(45deg, #33cc33, #33cc33 15px, #ff9933 15px, #ff9933 30px); background-color: unset; }
        .flag5 .flag-preview { background: linear-gradient(0deg, #ff6600, #ffffff, #009933); background-color: unset; }
        
        /* Bandera de poesía: texto legible */
        .flag-poesia .flag-preview {
            background: #fffbe6;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 0.55rem;
            font-weight: bold;
            line-height: 1.2;
            text-transform: none;
            padding: 4px;
            word-break: break-word;
            text-align: center;
        }

        /* Contenedor del poema - SIN RECUADRO, sin bordes */
        .poem-container {
            background: black;
            padding: 0;
            margin: 0;
        }
        .poem-lines {
            font-family: 'Alumni Sans', sans-serif;
            font-size: 1.6rem;
            line-height: 1.4;
            color: white;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .poem-line {
            margin: 12px 0;
            text-align: center;
            width: auto;
            max-width: 90%;
        }

        /* Botones generales */
        .btn {
            font-family: 'Bungee', cursive;
            background: #111;
            border: 1px solid #333;
            padding: 14px 24px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            width: 100%;
            margin-top: 16px;
        }
        .btn:active {
            transform: scale(0.97);
            background: #222;
        }

        /* Menú principal */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }
        .menu-btn {
            background: #111;
            color: white;
            border: 1px solid #333;
        }

        footer {
            text-align: center;
            font-family: 'Alumni Sans', sans-serif;
            font-size: 0.9rem;
            color: #666;
            margin-top: 28px;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
            z-index: 1000;
        }
        .modal.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #111;
            padding: 32px 24px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #333;
        }
        .modal-card h3 {
            font-family: 'Bungee', cursive;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 16px;
        }
        .modal-card p {
            background: #1a1a1a;
            padding: 16px;
            color: #ddd;
            font-family: 'Alumni Sans', sans-serif;
            font-size: 1.2rem;
            margin: 16px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .modal-btn {
            background: #222;
            border: 1px solid #444;
            font-family: 'Bungee', cursive;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 0.8rem;
            color: white;
        }
        .modal-btn:active { transform: scale(0.96); }

        @media (max-width: 560px) {
            .flag-card { width: 100px; }
            .title-lg { font-size: 1.5rem; }
            .poem-lines { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Pantalla de banderas -->
    <div id="splashScreen" class="screen">
        <div class="title-lg"> elegí tu bandera </div>
        <div class="flags-grid">
            <div class="flag-card flag1" data-flag="1">
                <div class="flag-preview"></div>
                <span></span>
            </div>
            <div class="flag-card flag2" data-flag="2">
                <div class="flag-preview"></div>
                <span></span>
            </div>
            <div class="flag-card flag3" data-flag="3">
                <div class="flag-preview"></div>
                <span></span>
            </div>
            <div class="flag-card flag4" data-flag="4">
                <div class="flag-preview"></div>
                <span></span>
            </div>
            <div class="flag-card flag5" data-flag="5">
                <div class="flag-preview"></div>
                <span></span>
            </div>
            <div class="flag-card flag-poesia" data-flag="poesia">
                <div class="flag-preview">acá se está leyendo poesía</div>
                <span></span>
            </div>
        </div>
        <footer></footer>
    </div>

    <!-- Pantalla de poema (efecto letra por letra, sin recuadro) -->
    <div id="loadingScreen" class="screen hidden">
        <div class="poem-container">
            <div id="poemLines" class="poem-lines"></div>
        </div>
    </div>

    <!-- Menú principal -->
    <div id="mainMenu" class="screen hidden">
        <div class="title-lg">LA CUESTIÓN</div>
        <div class="menu-buttons">
            <button id="btnUbicacion" class="btn menu-btn">📍 UBICACIÓN</button>
            <button id="btnEntradas" class="btn menu-btn">🎟️ ENTRADAS</button>
            <button id="btnPista" class="btn menu-btn">🔍 PISTA</button>
        </div>
        <footer></footer>
    </div>
</div>

<!-- Modal -->
<div id="modalWin" class="modal">
    <div class="modal-card">
        <h3 id="modalTitle">---</h3>
        <p id="modalMessage"></p>
        <div id="modalExtra" class="modal-buttons"></div>
        <div class="modal-buttons">
            <button id="closeModalBtn" class="modal-btn">Cerrar</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ========== POEMA: efecto letra por letra MÁS LENTO (110ms) ==========
        const poemLines = [
            "y al final,",
            "un poco más tarde ke ahora,",
            "cuando estés volviendo a tu casa,",
            "mirarte y decir:",
            "hoy fue para mi",
            "hoy, a este mundo,",
            "le robé una noche"
        ];

        let typingInterval = null;
        let currentLineIdx = 0, currentChar = 0, currentLineEl = null;

        function startTypingEffect(callback) {
            const container = document.getElementById('poemLines');
            if (!container) return;
            container.innerHTML = '';
            currentLineIdx = 0;
            currentChar = 0;

            function typeNextChar() {
                if (currentLineIdx >= poemLines.length) {
                    if (typingInterval) clearInterval(typingInterval);
                    if (callback) callback();
                    return;
                }
                const line = poemLines[currentLineIdx];
                if (currentChar === 0) {
                    currentLineEl = document.createElement('div');
                    currentLineEl.className = 'poem-line';
                    currentLineEl.textContent = '';
                    container.appendChild(currentLineEl);
                }
                if (currentChar < line.length) {
                    currentLineEl.textContent += line[currentChar];
                    currentChar++;
                } else {
                    currentLineIdx++;
                    currentChar = 0;
                    currentLineEl = null;
                }
            }
            // Velocidad más lenta: 110ms por carácter
            typingInterval = setInterval(typeNextChar, 110);
        }

        function stopTyping() {
            if (typingInterval) {
                clearInterval(typingInterval);
                typingInterval = null;
            }
        }

        // ========== FLUJO DE PANTALLAS ==========
        const splashDiv = document.getElementById('splashScreen');
        const loadingDiv = document.getElementById('loadingScreen');
        const menuDiv = document.getElementById('mainMenu');
        let loadingActive = false;

        function startLoading() {
            if (loadingActive) return;
            loadingActive = true;
            splashDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            menuDiv.classList.add('hidden');
            
            startTypingEffect(() => {
                setTimeout(() => {
                    finishLoading();
                }, 1000);
            });
        }

        function finishLoading() {
            stopTyping();
            loadingDiv.classList.add('hidden');
            menuDiv.classList.remove('hidden');
            loadingActive = false;
        }

        // ========== EVENTO DE BANDERAS ==========
        const flagCards = document.querySelectorAll('.flag-card');
        flagCards.forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                startLoading();
            });
        });

        // ========== MODAL Y BOTONES DEL MENÚ ==========
        const modal = document.getElementById('modalWin');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalExtra = document.getElementById('modalExtra');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function closeModal() {
            modal.classList.remove('active');
            modalExtra.innerHTML = '';
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

        document.getElementById('btnUbicacion').addEventListener('click', () => {
            window.open('https://maps.app.goo.gl/PEDo2gsqMswidQzN6', '_blank');
        });

        // ENTRADAS: alias y Mercado Pago
        document.getElementById('btnEntradas').addEventListener('click', (e) => {
            e.preventDefault();
            const alias = "ellorenzopa.banda";
            const monto = "4000";
            modalTitle.innerText = "Entradas - $4000";
            modalMessage.innerText = `Alias: ${alias} (a nombre de Mafalda Faggian)
            modalExtra.innerHTML = '';

            const btnCopy = document.createElement('button');
            btnCopy.innerText = "📋 COPIAR ALIAS";
            btnCopy.classList.add('modal-btn');
            btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(alias).then(() => {
                    mostrarToast("Alias copiado: " + alias);
                }).catch(() => alert("Copiá manual: " + alias));
            });
            modalExtra.appendChild(btnCopy);

            const btnMP = document.createElement('button');
            btnMP.innerText = "💰 Mercado Pago";
            btnMP.classList.add('modal-btn');
            btnMP.addEventListener('click', () => {
                const deepLink = "mercadopago://";
                const webUrl = "https://www.mercadopago.com.ar/transferencias";
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = deepLink;
                document.body.appendChild(iframe);
                const timeout = setTimeout(() => {
                    window.location.href = webUrl;
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 800);
                window.addEventListener('blur', () => {
                    clearTimeout(timeout);
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, { once: true });
                setTimeout(() => {
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 1000);
                closeModal();
            });
            modalExtra.appendChild(btnMP);

            modal.classList.add('active');
        });

        document.getElementById('btnPista').addEventListener('click', () => {
            modalTitle.innerText = "Pista Oculta";
            modalMessage.innerText = '"seremos el centro del temblor"';
            modalExtra.innerHTML = '';
            const okBtn = document.createElement('button');
            okBtn.innerText = "Entendido";
            okBtn.classList.add('modal-btn');
            okBtn.addEventListener('click', closeModal);
            modalExtra.appendChild(okBtn);
            modal.classList.add('active');
        });

        function mostrarToast(msg) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#1a1a1a';
            toast.style.color = '#fff';
            toast.style.padding = '10px 20px';
            toast.style.fontFamily = 'Alumni Sans, sans-serif';
            toast.style.borderRadius = '0';
            toast.style.border = '1px solid #444';
            toast.style.zIndex = '10000';
            toast.style.fontSize = '1rem';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    })();
</script>
</body>
</html>
